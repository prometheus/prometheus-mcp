apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp
  namespace: default
  labels:
    app: prometheus-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-mcp
  template:
    metadata:
      labels:
        app: prometheus-mcp
    spec:
      containers:
      - name: prometheus-mcp
        image: prom/prometheus-mcp:latest
        args:
        - '--prometheus.url=http://prometheus-service.prometheus.svc:9090' # set your prometheus url here
        - '--mcp.transport=http'
        - '--web.listen-address=:8080'
        - '--log.level=info'
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
