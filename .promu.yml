go:
    # Whenever the Go version is updated here, .github/workflows/ci.yml should
    # also be updated.
    version: 1.27
repository:
    path: github.com/prometheus/prometheus-mcp
build:
    binaries:
        - name: prometheus-mcp
          path: ./cmd/prometheus-mcp
    ldflags: |
        -X github.com/prometheus/common/version.Version={{.Version}}
        -X github.com/prometheus/common/version.Revision={{.Revision}}
        -X github.com/prometheus/common/version.Branch={{.Branch}}
        -X github.com/prometheus/common/version.BuildUser={{user}}@{{host}}
        -X github.com/prometheus/common/version.BuildDate={{date "20060102-15:04:05"}}
crossbuild:
    platforms:
        - linux/amd64
        - linux/386
        - darwin/amd64
        - darwin/arm64
        - windows/amd64
        - windows/arm64
        - windows/386
        - freebsd/amd64
        - freebsd/386
        - openbsd/amd64
        - openbsd/386
        - netbsd/amd64
        - netbsd/386
        - dragonfly/amd64
        - linux/arm
        - linux/arm64
        - freebsd/arm
        - openbsd/arm
        - netbsd/arm
        - linux/ppc64
        - linux/ppc64le
        - linux/mips64
        - linux/mips64le
        - linux/s390x
tarball:
    files:
        - LICENSE
        - README.md
        - packaging/systemd/prometheus-mcp.service
